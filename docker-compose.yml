services:

  web:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: document_qa_web

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      DJANGO_DATA_DIR: /data
      HF_HOME: /models

    volumes:
      - ./docker_data:/data
      - model_cache:/models

volumes:

  model_cache: